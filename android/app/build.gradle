plugins {
    id 'com.android.application'
}

// Release signing: local keystore.properties first, then KOBOID_* environment variables (CI).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else if (System.getenv('KOBOID_KEYSTORE_FILE')) {
    keystoreProperties['storeFile'] = System.getenv('KOBOID_KEYSTORE_FILE')
    keystoreProperties['storePassword'] = System.getenv('KOBOID_KEYSTORE_PASSWORD')
    keystoreProperties['keyAlias'] = System.getenv('KOBOID_KEY_ALIAS')
    keystoreProperties['keyPassword'] = System.getenv('KOBOID_KEY_PASSWORD')
}
def hasReleaseSigning = keystoreProperties['storeFile'] != null

// CI passes -PversionName=1.2.0 -PversionCode=10200 derived from the release tag.
def appVersionName = findProperty('versionName') ?: '1.1'
def appVersionCode = (findProperty('versionCode') ?: '2') as Integer

android {
    namespace "com.koboid.scanner"
    compileSdk 35

    defaultConfig {
        applicationId "com.koboid.scanner"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Real phones only; debug builds keep x86 for emulators.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout

    // CameraX
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    // ML Kit OCR
    implementation libs.play.services.tasks
    implementation libs.mlkit.text.recognition

    // Kotlin
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.play.services
}
